# Copy this file to a secure location, fill in real values, and apply it.
# Do not add this file to kustomization.yaml or commit a populated Secret.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: backstage
type: Opaque
stringData:
  POSTGRES_HOST: your-postgres-host
  POSTGRES_PORT: "5432"
  POSTGRES_USER: backstage
  POSTGRES_PASSWORD: replace-me
