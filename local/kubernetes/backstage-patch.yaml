apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backstage
          image: idp-backstage:local
          imagePullPolicy: Never
          args:
            - --config
            - app-config.yaml
            - --config
            - /app/config/app-config.platform.yaml
          env:
            - name: NODE_ENV
              value: production
            - name: APP_CONFIG_app_baseUrl
              value: http://localhost:7007
            - name: APP_CONFIG_backend_baseUrl
              value: http://localhost:7007
            - name: APP_CONFIG_backend_cors_origin
              value: http://localhost:7007
            - name: BACKSTAGE_BASE_URL
              value: http://localhost:7007
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
