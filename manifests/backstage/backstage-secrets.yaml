# Demo-only value. Replace GITHUB_TOKEN with a Secret manager integration or
# apply a sealed/encrypted Secret before using the portal for real provisioning.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
stringData:
  BACKSTAGE_BASE_URL: https://backstage.example.com
  GITHUB_TOKEN: replace-with-github-token
