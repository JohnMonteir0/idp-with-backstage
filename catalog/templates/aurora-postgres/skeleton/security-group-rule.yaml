apiVersion: ec2.aws.upbound.io/v1beta1
kind: SecurityGroupRule
metadata:
  name: ${{ values.name }}-postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    platform.example.org/database: ${{ values.name }}
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: aws
  forProvider:
    region: ${{ values.region }}
    type: ingress
    fromPort: 5432
    toPort: 5432
    protocol: tcp
    securityGroupIdRef:
      name: ${{ values.name }}-db
    sourceSecurityGroupId: ${{ values.clientSecurityGroupId }}
