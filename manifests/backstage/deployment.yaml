apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: backstage
        image: REPLACE_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/backstage:REPLACE_IMAGE_TAG
        command:
        - node
        - packages/backend
        args:
        - --config
        - app-config.yaml
        - --config
        - app-config.production.yaml
        - --config
        - /etc/backstage/app-config.platform.yaml
        ports:
        - name: http
          containerPort: 7007
        env:
        - name: NODE_ENV
          value: production
        - name: BACKSTAGE_BASE_URL
          value: https://backstage-dev.REPLACE_ACCOUNT_ID.montlabz.com
        envFrom:
        - secretRef:
            name: backstage-secrets
        volumeMounts:
        - name: config
          mountPath: /etc/backstage
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 60
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: backstage-platform-config
