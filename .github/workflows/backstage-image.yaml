name: Build Backstage and propose deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backstage-image.yaml'
      - 'docker/**'
      - 'scripts/configure-backstage.py'

permissions:
  contents: read

concurrency:
  group: backstage-image
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.BACKSTAGE_BUILD_ROLE_ARN }}
      SOURCE_REPOSITORY: ${{ secrets.BACKSTAGE_SOURCE_REPOSITORY }}
      SOURCE_REVISION: ${{ secrets.BACKSTAGE_SOURCE_REVISION }}
      ECR_REPOSITORY: ${{ secrets.BACKSTAGE_ECR_REPOSITORY || 'backstage' }}
      BACKSTAGE_ENVIRONMENT: ${{ secrets.BACKSTAGE_ENVIRONMENT || 'dev' }}
      TLS_SECRET_NAME: ${{ secrets.BACKSTAGE_TLS_SECRET_NAME || 'backstage-tls' }}
      CLOUDFLARE_PROXIED: ${{ secrets.BACKSTAGE_CLOUDFLARE_PROXIED || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Validate configuration
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AWS_REGION" ]]; then
            echo "::error::Missing GitHub repository variable: AWS_REGION"
            exit 1
          fi
          declare -A required_secrets=(
            [AWS_ROLE_ARN]=BACKSTAGE_BUILD_ROLE_ARN
            [SOURCE_REPOSITORY]=BACKSTAGE_SOURCE_REPOSITORY
            [SOURCE_REVISION]=BACKSTAGE_SOURCE_REVISION
          )
          for variable in "${!required_secrets[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub repository secret: ${required_secrets[$variable]} (see docs/image-workflow.md)"
              exit 1
            fi
          done
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Source revision must be a full commit SHA'; exit 1; }
          repository="$SOURCE_REPOSITORY"
          repository="${repository#https://github.com/}"
          repository="${repository#http://github.com/}"
          repository="${repository#git@github.com:}"
          repository="${repository#github.com/}"
          repository="${repository%.git}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::BACKSTAGE_SOURCE_REPOSITORY must be owner/repo or a GitHub URL (received an invalid value)"
            exit 1
          fi
          echo "SOURCE_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - name: Fetch existing Backstage application
        env:
          SOURCE_TOKEN: ${{ secrets.BACKSTAGE_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir .build-source
          git -C .build-source init --quiet
          git -C .build-source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          if [[ -n "$SOURCE_TOKEN" ]]; then
            git -C .build-source -c http.extraheader="AUTHORIZATION: bearer $SOURCE_TOKEN" fetch --depth=1 origin "$SOURCE_REVISION"
          else
            git -C .build-source fetch --depth=1 origin "$SOURCE_REVISION"
          fi
          git -C .build-source checkout --detach --quiet FETCH_HEAD
          git -C .build-source config --local remote.origin.url "https://github.com/${SOURCE_REPOSITORY}.git"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build application bundle
        working-directory: .build-source
        shell: bash
        run: |
          set -euo pipefail
          for required_file in yarn.lock packages/backend/Dockerfile app-config.production.yaml; do
            if [[ ! -f "$required_file" ]]; then
              echo "::error::Backstage source repository is missing $required_file"
              echo "::error::BACKSTAGE_SOURCE_REPOSITORY must point to the Backstage application repository, not this infrastructure repository or an ECR URI."
              exit 1
            fi
          done
          corepack enable
          echo 'Installing Backstage dependencies'
          yarn install --immutable
          echo 'Type-checking Backstage'
          yarn tsc
          echo 'Building the Backstage backend bundle'
          yarn build:backend
      - name: Build runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f .build-source/packages/backend/Dockerfile -t backstage-app:build .build-source
          curl --fail --silent --show-error --location --retry 3 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            --output docker/global-bundle.pem
          docker build --build-arg BASE_IMAGE=backstage-app:build -f docker/Dockerfile -t backstage-runtime:build docker
      - name: Assume ECR publisher role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish image and calculate hostname
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          image="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag backstage-runtime:build "$image"
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
      - name: Update deployment and ingress
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          AWS_ACCOUNT_ID: ${{ steps.image.outputs.account_id }}
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 scripts/configure-backstage.py
          kubectl kustomize platform/backstage > /tmp/backstage-rendered.yaml
      - name: Open deployment pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/backstage-image
          base: main
          add-paths: |
            platform/backstage/deployment.yaml
            platform/backstage/ingress.yaml
          commit-message: 'Deploy Backstage image and configure ExternalDNS'
          title: 'Deploy Backstage image'
          body: |
            Updates Backstage to `${{ steps.image.outputs.image }}`.

            Source: `${{ env.SOURCE_REPOSITORY }}@${{ env.SOURCE_REVISION }}`.
            Environment: `${{ env.BACKSTAGE_ENVIRONMENT }}`.

            Review and merge to let the existing Argo CD Backstage Application sync.
            The ingress hostname, ExternalDNS annotations and Backstage URL are updated together.
