# Demo credentials for the in-cluster PostgreSQL used by this example.
# Replace with a SealedSecret/ExternalSecret before production use.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: backstage
type: Opaque
stringData:
  POSTGRES_HOST: postgres.backstage
  POSTGRES_PORT: "5432"
  POSTGRES_USER: backstage
  POSTGRES_PASSWORD: hunter2
