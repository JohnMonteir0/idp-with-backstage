apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rds-postgres
  title: PostgreSQL database
  description: Request PostgreSQL through the intent-based platform API.
  tags: [database, crossplane, golden-path]
spec:
  owner: group:default/platform-team
  type: resource
  parameters:
    - title: Ownership and intent
      required: [name, owner, environment, databaseName, size, availability]
      properties:
        name: {title: Database name, type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 30}
        owner: {title: Owning team slug, type: string, pattern: '^[a-z][a-z0-9-]{1,38}[a-z0-9]$', maxLength: 20, default: platform-team}
        environment: {title: Environment, type: string, enum: [development, staging, production], default: development}
        databaseName: {title: Initial database name, type: string, pattern: '^[a-z][a-z0-9]{0,30}$', default: appdb}
        size:
          title: Workload size
          description: Maps to platform-approved compute and storage.
          type: string
          enum: [small, medium, large]
          default: small
        availability: {title: Availability, type: string, enum: [standard, highly-available], default: standard}
    - title: Placement
      required: [region, vpcId, subnetIds, clientSecurityGroupId]
      properties:
        region: {title: AWS region, type: string, enum: [us-east-1, us-east-2, us-west-2, sa-east-1, eu-west-1], default: us-east-1}
        vpcId: {title: Existing VPC ID, type: string, pattern: '^vpc-([0-9a-f]{8}|[0-9a-f]{17})$'}
        subnetIds:
          title: Private subnet IDs
          type: array
          minItems: 2
          uniqueItems: true
          items: {type: string, pattern: '^subnet-([0-9a-f]{8}|[0-9a-f]{17})$'}
        clientSecurityGroupId: {title: Client security group ID, type: string, pattern: '^sg-([0-9a-f]{8}|[0-9a-f]{17})$'}
  steps:
    - id: render
      name: Generate platform request
      action: fetch:template
      input:
        url: https://github.com/JohnMonteir0/idp-with-backstage/tree/main/catalog/templates/rds-postgres/skeleton
        targetPath: ./generated
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
          databaseName: ${{ parameters.databaseName }}
          size: ${{ parameters.size }}
          availability: ${{ parameters.availability }}
          region: ${{ parameters.region }}
          vpcId: ${{ parameters.vpcId }}
          subnetIds: ${{ parameters.subnetIds }}
          clientSecurityGroupId: ${{ parameters.clientSecurityGroupId }}
    - id: publish
      name: Open reviewed provisioning request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=JohnMonteir0&repo=idp-with-backstage
        targetBranchName: main
        branchName: database/${{ parameters.environment }}/${{ parameters.owner }}/${{ parameters.name }}
        title: Request PostgreSQL database ${{ parameters.name }}
        description: Review ownership, placement, availability, data policy, and cost before merging.
        sourcePath: ./generated
        targetPath: requests/databases/${{ parameters.environment }}/${{ parameters.owner }}/${{ parameters.name }}
  output:
    links:
      - title: Review provisioning pull request
        url: ${{ steps.publish.output.remoteUrl }}
